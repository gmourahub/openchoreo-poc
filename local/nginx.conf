# Plain TCP passthrough from localhost to the k3s node, where servicelb binds
# each LoadBalancer port. Host headers and TLS pass through untouched.
events {}
stream {
  resolver 127.0.0.11 valid=10s;
  map $server_port $node { default floci-aws-eks-openchoreo; }
  server { listen 8080;  proxy_pass $node:8080; }
  server { listen 8443;  proxy_pass $node:8443; }
  server { listen 19080; proxy_pass $node:19080; }
  server { listen 19443; proxy_pass $node:19443; }
  server { listen 10081; proxy_pass $node:10081; }
  server { listen 10082; proxy_pass $node:10082; }
  server { listen 10083; proxy_pass $node:10083; }
  server { listen 11080; proxy_pass $node:11080; }
}
