# OpenChoreo on a Floci-emulated EKS cluster.
#   floci    -> AWS APIs; its EKS service runs the cluster as a k3s container
#   gateway  -> publishes the cluster's LoadBalancer ports (8080, 19080, ...) on localhost,
#               because Floci only publishes the API server port
#   toolbox  -> aws, kubectl, helm; runs the installer so nothing is installed on the host
name: openchoreo-floci

services:
  floci:
    image: floci/floci:2.3.0
    container_name: oc-floci
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: openchoreo-floci_default
      FLOCI_SERVICES_EKS_DEFAULT_STORAGE_CLASS: "true" # local-path PVCs (OpenBao, registry, ...)
      FLOCI_SERVICES_EKS_KEEP_RUNNING_ON_SHUTDOWN: "true"

  gateway:
    image: nginx:1.27-alpine
    container_name: oc-gateway
    profiles: ["gateway"] # started by up.sh once the cluster exists
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"   # control plane: console, API, Thunder
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:19080:19080" # data plane: deployed workloads
      - "127.0.0.1:19443:19443"
      - "127.0.0.1:10081:10081" # workflow plane: Argo UI (optional)
      - "127.0.0.1:10082:10082" # workflow plane: registry (optional)
      - "127.0.0.1:11080:11080" # observability plane: observer (optional)

  toolbox:
    image: cnoe-local-toolbox
    container_name: oc-toolbox
    command: sleep infinity
    working_dir: /repo
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - ../src:/repo
      - ./:/local
    environment:
      KUBECONFIG: /local/kubeconfig-internal
      AWS_ENDPOINT_URL: http://oc-floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

volumes:
  floci-data:
